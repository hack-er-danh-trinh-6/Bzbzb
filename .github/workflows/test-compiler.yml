name: Automated-DJI-Streaming-Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  media-processing:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Install System Dependencies (Chocolatey)
      run: |
        # Cài đặt đồng thời OBS Studio và NodeJS để lấy hạ tầng mở cổng LocalTunnel
        choco install obs-studio nodejs -y

    - name: Enable Windows Remote Desktop Configuration
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Configure System Access Password
      run: |
        net user runneradmin RdpPassword2026! /active:yes

    - name: Deploy Light RTMP Server
      run: |
        Write-Host "Setting up live broadcast pipeline ports..."
        New-Item -ItemType Directory -Force -Path "C:\StreamingServer"

    - name: Inject Virtual Graphics Driver for OBS Studio
      run: |
        $obsBinPath = "C:\Program Files\obs-studio\bin\64bit"
        if (!(Test-Path $obsBinPath)) { New-Item -ItemType Directory -Force -Path $obsBinPath }
        $dllUrl = "https://githubusercontent.com"
        try {
            Invoke-WebRequest -Uri $dllUrl -OutFile "$obsBinPath\opengl32.dll" -TimeoutSec 60
            Write-Host "Virtual Graphics Driver integrated successfully."
        } catch {
            Write-Host "Software emulation pipeline active."
        }

    - name: Start Network Services Gateway (SỬA LỖI WIN32 APPLICATION)
      run: |
        echo "----------------------------------------------------------------------"
        echo "HỆ THỐNG ĐANG TỰ ĐỘNG CẤP PHÁT PUBLIC IP KHÔNG CẦN THẺ NGÂN HÀNG..."
        echo "----------------------------------------------------------------------"
        
        # Cài đặt bộ công cụ LocalTunnel mở cổng TCP không cần tài khoản mạng công khai
        npm install -g localtunnel
        
        # Đfixed: Khởi chạy lệnh qua môi trường cmd /c npx để Windows thực thi script Node.js chính xác
        Start-Process cmd -ArgumentList "/c npx localtunnel --port 3389" -RedirectStandardOutput "rdp_public.log" -RedirectStandardError "rdp_err.log"
        Start-Process cmd -ArgumentList "/c npx localtunnel --port 1935" -RedirectStandardOutput "rtmp_public.log" -RedirectStandardError "rtmp_err.log"
        
        # Chờ 15 giây để máy chủ phân bổ cụm tên miền Public hoàn toàn miễn phí
        $timeout = 15
        while ($timeout -gt 0) {
            Start-Sleep -Seconds 3
            if ((Test-Path rdp_public.log) -and (Get-Content rdp_public.log)) {
                echo "=================== ĐỊA CHỈ KẾT NỐI CỦA BẠN ==================="
                echo "LIÊN KẾT RDP (DÙNG ĐỂ VÀO ĐIỀU KHIỂN OBS):"
                Get-Content rdp_public.log
                echo "---------------------------------------------------------------"
                echo "LIÊN KẾT RTMP (NHẬP VÀO TAY CẦM DJI MINI 3):"
                $rtmpRaw = Get-Content rtmp_public.log
                if ($rtmpRaw) {
                    $rtmpClean = $rtmpRaw.Replace("https://", "rtmp://").Replace("http://", "rtmp://")
                    echo "$rtmpClean/live/dji_stream"
                }
                echo "==============================================================="
                break
            }
            $timeout -= 3
        }
        
        # Nếu không có link, xuất log lỗi để kiểm tra cấu hình mạng
        if ($timeout -le 0) {
            echo "--- LOG LỖI HỆ THỐNG ---"
            if (Test-Path rdp_err.log) { Get-Content rdp_err.log }
            if (Test-Path rtmp_err.log) { Get-Content rtmp_err.log }
        }
        
        # Giữ máy ảo Windows Server hoạt động liên tục trong 6 tiếng để thực hiện Livestream
        Start-Sleep -Seconds 21600
