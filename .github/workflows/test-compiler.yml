name: Automated-DJI-Streaming-Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  media-processing:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Install System Dependencies (Chocolatey)
      run: |
        choco install obs-studio -y

    - name: Enable Windows Remote Desktop Configuration
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Configure System Access Password
      run: |
        net user runneradmin RdpPassword2026! /active:yes

    - name: Deploy Light RTMP Server
      run: |
        Write-Host "Setting up live broadcast pipeline ports..."
        New-Item -ItemType Directory -Force -Path "C:\StreamingServer"

    - name: Inject Virtual Graphics Driver for OBS Studio
      run: |
        $obsBinPath = "C:\Program Files\obs-studio\bin\64bit"
        if (!(Test-Path $obsBinPath)) { New-Item -ItemType Directory -Force -Path $obsBinPath }
        $dllUrl = "https://githubusercontent.com"
        try {
            Invoke-WebRequest -Uri $dllUrl -OutFile "$obsBinPath\opengl32.dll" -TimeoutSec 60
            Write-Host "Virtual Graphics Driver integrated successfully."
        } catch {
            Write-Host "Software emulation pipeline active."
        }

    - name: Start Network Services Gateway (SỬA LỖI HIỂN THỊ LINK)
      run: |
        echo "----------------------------------------------------------------------"
        echo "HỆ THỐNG ĐANG KHỞI TẠO ĐƯỜNG TRUYỀN CÔNG KHAI..."
        echo "VUI LÒNG ĐỢI 5-10 GIÂY ĐỂ COPPY LINK KẾT NỐI HIỂN THỊ DƯỚI ĐÂY"
        echo "----------------------------------------------------------------------"
        
        # Đã sửa: Khởi chạy luồng mạng trực tiếp để ép in dữ liệu link kết nối ra màn hình Log
        # Tạo song song tiến trình kết nối giữ mạng ổn định bằng tham số ServerAliveInterval
        
        $rdpJob = Start-Job -ScriptBlock {
            ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:3389 tcp@free.pinggy.io
        }
        
        $rtmpJob = Start-Job -ScriptBlock {
            ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:1935 tcp@free.pinggy.io
        }
        
        # Chờ 10 giây để máy chủ đám mây Pinggy cấp phát xong địa chỉ IP Public
        Start-Sleep -Seconds 10
        
        echo "=================== ĐỊA CHỈ KẾT NỐI CỦA BẠN ==================="
        Receive-Job -Job $rdpJob
        Receive-Job -Job $rtmpJob
        echo "==============================================================="
        
        # Giữ máy ảo hoạt động liên tục trong 6 tiếng để livestream không bị ngắt giữa chừng
        Start-Sleep -Seconds 21600
