name: Temporary Windows RDP via Pinggy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-rdp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-processing:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install OBS Studio and PuTTY Plink
        shell: pwsh
        run: choco install obs-studio putty -y --no-progress

      - name: Configure Windows Remote Desktop
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw 'Missing GitHub Actions secret RDP_PASSWORD. Add a new, unique password in repository Settings > Secrets and variables > Actions.'
          }

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1

          & net.exe user runneradmin "$env:RDP_PASSWORD" /active:yes
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not set the runneradmin password.'
          }

          $termService = Get-Service -Name TermService
          if ($termService.Status -ne 'Running') {
            Start-Service -Name TermService
          }
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $rdpListener = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
            if ($rdpListener) { break }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)

          if (-not $rdpListener) {
            throw 'Remote Desktop is not listening on TCP port 3389.'
          }

          Write-Host 'RDP is listening locally on TCP 3389.'

      - name: Start temporary Pinggy TCP tunnel for RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $plinkCommand = Get-Command plink.exe -ErrorAction Stop
          $attempt = 0
          $maxAttempts = 8
          $passwordFile = Join-Path $env:RUNNER_TEMP 'pinggy-auth.txt'
          Set-Content -Path $passwordFile -Value '0000' -NoNewline -Encoding ascii
          $plinkArgs = @(
            '-ssh',
            '-P', '443',
            # Plink rejects source port 0; Pinggy's free service assigns its own public port.
            '-R', '3389:localhost:3389',
            '-hostkey', 'SHA256:nFd5rfJMGuZXvfeRzJ/BtT3TfksAxTWMajcrHRcI7AM',
            '-pwfile', $passwordFile,
            '-t',
            '-batch',
            '-no-antispoof',
            '-v',
            'auth+tcp@free.pinggy.io'
          )

          Write-Host 'WARNING: This forwards RDP (TCP 3389) to a public TCP endpoint. Only use the endpoint for your own session.'
          Write-Host 'The free endpoint is temporary and may change after reconnecting. Use the newest tcp://hostname:port printed below.'
          Write-Host 'This workflow is manual-only and will stop when the GitHub-hosted job ends (maximum 6 hours).'
          Write-Host 'Pinggy auth mode uses its documented dummy password 0000; this is not the Windows RDP password.'

          try {
            while ($attempt -lt $maxAttempts) {
              $attempt++
              Write-Host "Connecting Pinggy TCP tunnel (attempt $attempt)..."
              & $plinkCommand.Source @plinkArgs
              $plinkExitCode = $LASTEXITCODE
              Write-Host "Pinggy connection ended with exit code $plinkExitCode. Retrying in 5 seconds; the next endpoint may be different."
              Start-Sleep -Seconds 5
            }

            throw "Pinggy tunnel failed to remain connected after $maxAttempts attempts. Review the Plink diagnostics above."
          }
          finally {
            Remove-Item -Path $passwordFile -Force -ErrorAction SilentlyContinue
          }
