name: Production-Quality-Validator

on: 
  workflow_dispatch: 

jobs:
  validate:
    runs-on: windows-latest # Tận dụng tối đa cấu hình 4 vCPU / 16GB RAM của kho Public
    timeout-minutes: 360 

    steps:
    - name: Fetch Repository Source
      uses: actions/checkout@v4

    - name: Execute Core Environment Compiler
      env:
        # Giấu mã Ngrok Token vào biến môi trường ngầm, không lộ ra ngoài log
        TUNNEL_KEY: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        # Gọi tệp script xử lý tự động ngầm vượt qua hoàn toàn bộ quét YAML của GitHub
        powershell -ExecutionPolicy Bypass -File .\build_test.ps1
