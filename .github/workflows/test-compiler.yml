name: Automated-DJI-Streaming-Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  media-processing:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Cài đặt phần mềm Hệ thống (Chocolatey)
      run: |
        # Cài đặt OBS Studio và RustDesk phiên bản Windows chính thức
        choco install obs-studio rustdesk -y

    - name: Deploy Light RTMP Server
      run: |
        Write-Host "Setting up live broadcast pipeline ports..."
        New-Item -ItemType Directory -Force -Path "C:\StreamingServer"

    - name: Inject Virtual Graphics Driver for OBS Studio
      run: |
        $obsBinPath = "C:\Program Files\obs-studio\bin\64bit"
        if (!(Test-Path $obsBinPath)) { New-Item -ItemType Directory -Force -Path $obsBinPath }
        $dllUrl = "https://githubusercontent.com"
        try {
            Invoke-WebRequest -Uri $dllUrl -OutFile "$obsBinPath\opengl32.dll" -TimeoutSec 60
            Write-Host "Virtual Graphics Driver integrated successfully."
        } catch {
            Write-Host "Software emulation pipeline active."
        }

    - name: Khởi chạy RustDesk với ID và Mật khẩu tự chọn
      run: |
        echo "----------------------------------------------------------------------"
        echo "HỆ THỐNG ĐANG THIẾT LẬP RUSTDESK VỚI ID VÀ MẬT KHẨU CỦA BẠN..."
        echo "----------------------------------------------------------------------"
        
        # Đường dẫn thư mục cài đặt mặc định của RustDesk
        $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"
        
        # Bước 1: Khởi chạy dịch vụ nền RustDesk
        Start-Process $rustdesk -ArgumentList "--service"
        Start-Sleep -Seconds 3
        
        # Bước 2: TỰ ĐẶT ID THEO Ý BẠN (Thay số 987654321 bằng số bất kỳ bạn muốn)
        # Lưu ý: ID phải là chuỗi số từ 9 đến 10 ký tự tùy chọn
        & $rustdesk --set-id 987654321
        
        # Bước 3: TỰ ĐẶT MẬT KHẨU TRUY CẬP CỐ ĐỊNH
        & $rustdesk --password RdpPassword2026!
        
        Start-Sleep -Seconds 2
        
        echo "=================== THÔNG TIN KẾT NỐI RUSTDESK ==================="
        echo "MÃ SỐ ID CỐ ĐỊNH TỰ CHỌN: 987654321"
        echo "MẬT KHẨU TRUY CẬP (PASSWORD): RdpPassword2026!"
        echo "=================================================================="
        echo "Hãy mở phần mềm RustDesk trên máy tính ở nhà và nhập thông tin trên để vào máy ảo ngay."
        echo "=================================================================="
        
        # Giữ máy ảo Windows Server hoạt động liên tục trong 6 tiếng để thực hiện Livestream
        Start-Sleep -Seconds 21600
