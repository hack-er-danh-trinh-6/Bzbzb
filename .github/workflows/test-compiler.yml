name: Automated-DJI-Streaming-Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  media-processing:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Install System Dependencies (Chocolatey)
      run: |
        choco install obs-studio -y

    - name: Enable Windows Remote Desktop Configuration
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Configure System Access Password
      run: |
        net user runneradmin RdpPassword2026! /active:yes

    - name: Deploy Light RTMP Server
      run: |
        Write-Host "Setting up live broadcast pipeline ports..."
        New-Item -ItemType Directory -Force -Path "C:\StreamingServer"

    - name: Inject Virtual Graphics Driver for OBS Studio
      run: |
        $obsBinPath = "C:\Program Files\obs-studio\bin\64bit"
        if (!(Test-Path $obsBinPath)) { New-Item -ItemType Directory -Force -Path $obsBinPath }
        $dllUrl = "https://githubusercontent.com"
        try {
            Invoke-WebRequest -Uri $dllUrl -OutFile "$obsBinPath\opengl32.dll" -TimeoutSec 60
            Write-Host "Virtual Graphics Driver integrated successfully."
        } catch {
            Write-Host "Software emulation pipeline active."
        }

    - name: Start Network Services Gateway (HIỂN THỊ LINK TÊN MIỀN)
      run: |
        echo "----------------------------------------------------------------------"
        echo "HỆ THỐNG ĐANG TỰ ĐỘNG CẤP PHÁT LINK KẾT NỐI MIỄN PHÍ..."
        echo "----------------------------------------------------------------------"
        
        # Tải bộ công cụ kết nối mạng trực tiếp từ máy chủ đám mây sạch
        Invoke-WebRequest -Uri "https://pagekite.net" -OutFile "pagekite.py"
        
        # Khởi chạy hầm mạng public trực tiếp cho cổng RDP (3389) và RTMP (1935)
        $rdpName = "rdp-" + (Get-Random -Minimum 10000 -Maximum 99999)
        $rtmpName = "rtmp-" + (Get-Random -Minimum 10000 -Maximum 99999)
        
        Start-Process python -ArgumentList "pagekite.py 3389 $rdpName.pagekite.me" -RedirectStandardOutput "rdp_dns.log"
        Start-Process python -ArgumentList "pagekite.py 1935 $rtmpName.pagekite.me" -RedirectStandardOutput "rtmp_dns.log"
        
        # Chờ 12 giây để hệ thống đám mây định danh đường truyền
        Start-Sleep -Seconds 12
        
        echo "=================== ĐỊA CHỈ KẾT NỐI CỦA BẠN ==================="
        echo "LIÊN KẾT RDP (DÙNG ĐỂ VÀO ĐIỀU KHIỂN OBS):"
        echo "$rdpName.pagekite.me"
        echo "---------------------------------------------------------------"
        echo "LIÊN KẾT RTMP (NHẬP VÀO TAY CẦM DJI MINI 3):"
        echo "rtmp://$rtmpName.pagekite.me/live/dji_stream"
        echo "==============================================================="
        
        # Giữ máy ảo Windows Server hoạt động ổn định liên tục trong 6 tiếng để thực hiện Livestream
        Start-Sleep -Seconds 21600
