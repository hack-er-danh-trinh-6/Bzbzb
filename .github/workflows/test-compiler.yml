name: Automated-DJI-Streaming-Pipeline

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: "Chrome Remote Desktop registration code"
        required: true
        type: string

permissions:
  contents: read

jobs:
  media-processing:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}

    steps:
      - name: Install and register Chrome Remote Desktop
        shell: pwsh
        env:
          CRD_CODE: ${{ inputs.crd_code }}
          CRD_PIN: ${{ secrets.CRD_PIN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CRD_CODE)) {
            throw "Missing CRD registration code."
          }

          if ([string]::IsNullOrWhiteSpace($env:CRD_PIN) -or $env:CRD_PIN.Length -lt 6) {
            throw "Configure the CRD_PIN secret with at least 6 characters."
          }

          $msi = Join-Path $env:RUNNER_TEMP "crd.msi"

          Invoke-WebRequest `
            -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
            -OutFile $msi

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait -PassThru

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Chrome Remote Desktop installation failed."
          }

          $exe = "${env:ProgramFiles(x86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $exe)) {
            throw "Chrome Remote Desktop host executable not found."
          }

          & $exe `
            "--code=$env:CRD_CODE" `
            "--redirect-url=https://remotedesktop.google.com/_/oauthredirect" `
            "--name=$env:COMPUTERNAME" `
            "--pin=$env:CRD_PIN"

          if ($LASTEXITCODE -ne 0) {
            throw "Chrome Remote Desktop registration failed."
          }

      - name: Install OBS Studio, Android Studio and ngrok
        shell: pwsh
        run: |
          choco install ngrok obs-studio androidstudio -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Tool installation failed."
          }

          if (-not (Get-Command ngrok -ErrorAction SilentlyContinue)) {
            throw "ngrok was not found."
          }

      - name: Enable Windows Remote Desktop
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Configure the RDP_PASSWORD GitHub secret."
          }

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name 'runneradmin' `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name 'runneradmin' `
              -Password $password `
              -Description 'Temporary workflow account'
          } else {
            Set-LocalUser -Name 'runneradmin' -Password $password
          }

          Enable-LocalUser -Name 'runneradmin'

      - name: Start ngrok TCP tunnel
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTHTOKEN)) {
            throw "Configure the NGROK_AUTHTOKEN GitHub secret."
          }

          $configPath = Join-Path $env:RUNNER_TEMP 'ngrok.yml'

          $config = @"
          version: 3
          agent:
            authtoken: $env:NGROK_AUTHTOKEN
          "@

          [System.IO.File]::WriteAllText(
            $configPath,
            $config,
            [System.Text.UTF8Encoding]::new($false)
          )

          ngrok config check --config $configPath

          if ($LASTEXITCODE -ne 0) {
            throw "ngrok configuration validation failed."
          }

          # Start a TCP tunnel to the Windows RDP port.
          # Keep the process in the foreground so the workflow
          # remains active while the tunnel is running.
          ngrok tcp 3389 `
            --config $configPath `
            --log stdout `
            --log-format logfmt
