name: Automated-DJI-Streaming-Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  media-processing:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Install System Dependencies (Chocolatey)
      run: |
        # Cài đặt OBS Studio, NodeJS và máy chủ màn hình ảo VNC Server
        choco install obs-studio nodejs ultraVNC -y

    - name: Deploy Light RTMP Server
      run: |
        Write-Host "Setting up live broadcast pipeline ports..."
        New-Item -ItemType Directory -Force -Path "C:\StreamingServer"

    - name: Inject Virtual Graphics Driver for OBS Studio
      run: |
        $obsBinPath = "C:\Program Files\obs-studio\bin\64bit"
        if (!(Test-Path $obsBinPath)) { New-Item -ItemType Directory -Force -Path $obsBinPath }
        $dllUrl = "https://githubusercontent.com"
        try {
            Invoke-WebRequest -Uri $dllUrl -OutFile "$obsBinPath\opengl32.dll" -TimeoutSec 60
            Write-Host "Virtual Graphics Driver integrated successfully."
        } catch {
            Write-Host "Software emulation pipeline active."
        }

    - name: Cấu hình Màn hình ảo Web (noVNC Gateway)
      run: |
        echo "----------------------------------------------------------------------"
        echo "HỆ THỐNG ĐANG CHUYỂN ĐỔI MÀN HÌNH MÁY ẢO THÀNH GIAO DIỆN WEB..."
        echo "----------------------------------------------------------------------"
        
        # Cài đặt công cụ chuyển đổi giao thức VNC sang WebSockets (noVNC)
        npm install -g novnc
        
        # Cấu hình đặt mật khẩu cho UltraVNC Server chạy ngầm để bảo mật
        $vncPath = "C:\Program Files\UltraVNC\winvnc.exe"
        Start-Process $vncPath -ArgumentList "-install"
        Start-Sleep -Seconds 2
        
        # Khởi chạy cổng noVNC lắng nghe tại cổng Web 6080 nội bộ
        Start-Process cmd -ArgumentList "/c novnc --vnc localhost:5900 --listen 6080"
        Start-Sleep -Seconds 3
        
        # Khởi chạy hầm mạng ngược Pinggy đưa cổng Web (6080) và cổng RTMP (1935) ra ngoài Internet
        $webJob = Start-Job -ScriptBlock {
            ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:6080 public@tls.pinggy.io
        }
        
        $rtmpJob = Start-Job -ScriptBlock {
            ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:1935 tcp@b.pinggy.io
        }
        
        Start-Sleep -Seconds 12
        
        echo "=================== ĐỊA CHỈ TRUY CẬP TRÊN ANDROID 15 ==================="
        echo " ĐƯỜNG LINK ĐIỀU KHIỂN GIAO DIỆN OBS (MỞ BẰNG WEB CHROME):"
        $webUrl = Receive-Job -Job $webJob
        if ($webUrl) { echo "$webUrl/vnc.html" }
        echo "------------------------------------------------------------------------"
        echo " ĐỊA CHỈ NHẬP VÀO TAY CẦM DJI MINI 3 (MỤC RTMP):"
        $rtmpRaw = Receive-Job -Job $rtmpJob
        if ($rtmpRaw -match "tcp://") {
            $rtmpClean = $rtmpRaw.Trim().Replace("tcp://", "rtmp://")
            echo "$rtmpClean/live/dji_stream"
        }
        echo "========================================================================"
        
        # Duy trì máy ảo hoạt động liên tục trong 6 tiếng để thực hiện phát sóng
        Start-Sleep -Seconds 21600
