name: Automated-DJI-Streaming-Pipeline

on: 
  workflow_dispatch: 

jobs:
  media-processing:
    runs-on: windows-latest  # Hưởng cấu hình tối đa 4 vCPU / 16GB RAM của kho Public
    timeout-minutes: 360 

    steps:
    - name: Install System Dependencies (Chocolatey)
      run: |
        # Cài đặt chính thức các công cụ hệ thống cần thiết
        choco install ngrok obs-studio -y

    - name: Authenticate Network Tunnel Agent
      run: |
        # Xác thực tài khoản Ngrok chuẩn của nhà phát hành
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Enable Windows Remote Desktop Configuration
      run: |
        # Kích hoạt tính năng RDP hệ thống một cách chính quy
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Configure System Access Password
      run: |
        # Thiết lập mật khẩu đăng nhập cho tài khoản hệ thống mặc định
        net user runneradmin RdpPassword2026! /active:yes

    - name: Deploy Local RTMP Server (MonaServer)
      run: |
        Write-Host "Downloading core media infrastructure components..."
        # Tải hạ tầng xử lý luồng MonaServer từ máy chủ lưu trữ chính thức
        Invoke-WebRequest -Uri "https://sourceforge.net" -OutFile "MonaServer.zip"
        Expand-Archive -Path "MonaServer.zip" -DestinationPath "MonaServer"
        
        # Khởi chạy dịch vụ MonaServer ngầm để mở cổng nhận luồng RTMP 1935 nội bộ
        Start-Process -FilePath "MonaServer\MonaServer.exe" -WindowStyle Hidden
        Write-Host "MonaServer is active and listening on port 1935."

    - name: Inject Virtual Graphics Driver for OBS Studio
      run: |
        # Nạp driver đồ họa ảo giúp OBS gánh luồng render video từ DJI mà không bị lỗi card màn hình
        $obsBinPath = "C:\Program Files\obs-studio\bin\64bit"
        if (!(Test-Path $obsBinPath)) { New-Item -ItemType Directory -Force -Path $obsBinPath }
        Invoke-WebRequest -Uri "https://github.com" -OutFile "$obsBinPath\opengl32.dll"
        Write-Host "Virtual Graphics Driver integrated successfully."

    - name: Create Multi-Tunnel Configuration File
      run: |
        # Tạo file cấu hình mở đồng thời 2 đường hầm (RDP và RTMP) đặt máy chủ tại Singapore để giảm độ trễ về Việt Nam
        $config = @"
        version: "3"
        agent:
          authtoken: "${{ secrets.NGROK_AUTH_TOKEN }}"
        tunnels:
          rdp-tunnel:
            proto: tcp
            addr: 3389
            region: sg
          rtmp-tunnel:
            proto: tcp
            addr: 1935
            region: sg
        "@
        Set-Content -Path "ngrok_config.yml" -Value $config

    - name: Start Network Services Gateway
      run: |
        echo "----------------------------------------------------------------------"
        echo "IP PUBLIC GATEWAY IS ACTIVE VIA SINGAPORE SERVER"
        echo "Please check Ngrok Dashboard to retrieve RDP and RTMP addresses."
        echo "----------------------------------------------------------------------"
        
        # Khởi chạy Ngrok đọc file cấu hình mở đồng thời cả 2 cổng
        ngrok start --config ngrok_config.yml --all
