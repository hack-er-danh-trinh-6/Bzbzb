name: Automated-DJI-Streaming-Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  media-processing:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Install System Dependencies (Chocolatey)
      run: |
        choco install obs-studio -y

    - name: Enable Windows Remote Desktop Configuration
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Configure System Access Password
      run: |
        net user runneradmin RdpPassword2026! /active:yes

    - name: Deploy Light RTMP Server
      run: |
        Write-Host "Setting up live broadcast pipeline ports..."
        New-Item -ItemType Directory -Force -Path "C:\StreamingServer"

    - name: Inject Virtual Graphics Driver for OBS Studio
      run: |
        $obsBinPath = "C:\Program Files\obs-studio\bin\64bit"
        if (!(Test-Path $obsBinPath)) { New-Item -ItemType Directory -Force -Path $obsBinPath }
        $dllUrl = "https://githubusercontent.com"
        try {
            Invoke-WebRequest -Uri $dllUrl -OutFile "$obsBinPath\opengl32.dll" -TimeoutSec 60
            Write-Host "Virtual Graphics Driver integrated successfully."
        } catch {
            Write-Host "Software emulation pipeline active."
        }

    - name: Start Network Services Gateway (GỘP KẾT NỐI)
      run: |
        echo "----------------------------------------------------------------------"
        echo "HỆ THỐNG ĐANG KHỞI TẠO ĐƯỜNG TRUYỀN CÔNG KHAI QUA SERVEO..."
        echo "----------------------------------------------------------------------"
        
        # Đugb: Gộp chung RDP (3389) và RTMP (1935) vào 1 kết nối duy nhất để tránh bị chặn cổng
        # Ép in thông tin kết nối trực tiếp ra file log hệ thống bằng cấu hình đa luồng
        Start-Process ssh -ArgumentList "-n -N -T -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:3389 -R 0:localhost:1935 serveo.net" -RedirectStandardError "serveo_gateway.log"
        
        # Vòng lặp chờ 15 giây để Serveo phản hồi và gán địa chỉ IP Public
        $timeout = 15
        while ($timeout -gt 0) {
            Start-Sleep -Seconds 3
            if ((Test-Path serveo_gateway.log) -and (Get-Content serveo_gateway.log)) {
                echo "=================== ĐỊA CHỈ KẾT NỐI CỦA BẠN ==================="
                Get-Content serveo_gateway.log
                echo "==============================================================="
                break
            }
            $timeout -= 3
        }
        
        # Giữ máy ảo Windows Server hoạt động liên tục trong 6 tiếng để thực hiện Livestream
        Start-Sleep -Seconds 21600
