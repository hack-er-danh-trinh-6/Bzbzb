name: Core-Service-Pipeline

on: 
  workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360 

    steps:
    - name: Cài đặt Ngrok bằng Snap
      run: |
        sudo snap install ngrok
        
    - name: Khởi chạy Giao diện điều khiển Stream (Owncast Docker)
      run: |
        # Tạo thư mục lưu trữ dữ liệu cấu hình luồng phát
        mkdir -p data
        # Khởi chạy Owncast Web UI thông qua Docker container trên cổng 8080
        docker run -d -p 8080:8080 --name stream-ui -v $(pwd)/data:/app/data owncast/owncast:latest
        
    - name: Kích hoạt đường hầm Web Panel công khai
      run: |
        echo "------------------------------------------------------------"
        echo "Hệ thống đang khởi tạo Giao diện điều khiển Web..."
        echo "Vui lòng truy cập https://ngrok.com để lấy link Web"
        echo "------------------------------------------------------------"
        # Bỏ qua bước lưu file cấu hình bằng cách truyền trực tiếp token xác thực vào ngrok
        sudo ngrok http 8080 --authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
