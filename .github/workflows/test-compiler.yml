name: Automated-DJI-Streaming-Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  media-processing:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Install System Dependencies (Chocolatey)
      run: |
        choco install obs-studio -y

    - name: Enable Windows Remote Desktop Configuration
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Configure System Access Password
      run: |
        net user runneradmin RdpPassword2026! /active:yes

    - name: Deploy Light RTMP Server
      run: |
        Write-Host "Setting up live broadcast pipeline ports..."
        New-Item -ItemType Directory -Force -Path "C:\StreamingServer"

    - name: Inject Virtual Graphics Driver for OBS Studio
      run: |
        $obsBinPath = "C:\Program Files\obs-studio\bin\64bit"
        if (!(Test-Path $obsBinPath)) { New-Item -ItemType Directory -Force -Path $obsBinPath }
        $dllUrl = "https://githubusercontent.com"
        try {
            Invoke-WebRequest -Uri $dllUrl -OutFile "$obsBinPath\opengl32.dll" -TimeoutSec 60
            Write-Host "Virtual Graphics Driver integrated successfully."
        } catch {
            Write-Host "Software emulation pipeline active."
        }

    - name: Start Network Services Gateway (CỔNG SERVEO CỐ ĐỊNH)
      run: |
        echo "----------------------------------------------------------------------"
        echo "HỆ THỐNG ĐANG KHỞI TẠO ĐƯỜNG TRUYỀN CÔNG KHAI QUA SERVEO..."
        echo "----------------------------------------------------------------------"
        
        # Khởi tạo 2 số cổng ngẫu nhiên cục bộ cho phiên chạy này để gửi trực tiếp lên Serveo
        $rdpPublicPort = Get-Random -Minimum 25000 -Maximum 35000
        $rtmpPublicPort = Get-Random -Minimum 35001 -Maximum 45000
        
        # ĐÃ SỬA: Thay thế số '0' bằng biến số cổng cụ thể để ép Serveo mở đồng thời cả 2 luồng mạng
        Start-Process ssh -ArgumentList "-n -N -T -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R $rdpPublicPort:localhost:3389 -R $rtmpPublicPort:localhost:1935 serveo.net" -RedirectStandardError "serveo_gateway.log"
        
        # Vòng lặp chờ 15 giây để máy chủ đám mây ghi nhận
        Start-Sleep -Seconds 15
        
        echo "=================== ĐỊA CHỈ KẾT NỐI CỦA BẠN ==================="
        echo "LIÊN KẾT RDP (DÙNG CHO ANDROID / PC VÀO ĐIỀU KHIỂN OBS):"
        echo "Nhập địa chỉ: serveo.net:$rdpPublicPort"
        echo "---------------------------------------------------------------"
        echo "LIÊN KẾT RTMP (NHẬP VÀO TAY CẦM DJI MINI 3):"
        echo "rtmp://serveo.net:$rtmpPublicPort/live/dji_stream"
        echo "==============================================================="
        echo "--- LOG CHI TIẾT HỆ THỐNG (NẾU BỊ TRÙNG CỔNG) ---"
        if (Test-Path serveo_gateway.log) { Get-Content serveo_gateway.log }
        
        # Giữ máy ảo Windows Server hoạt động liên tục trong 6 tiếng để thực hiện Livestream
        Start-Sleep -Seconds 21600
