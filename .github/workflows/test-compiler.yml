name: Temporary Windows RDP and RTMP via Pinggy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-rdp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-processing:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install OBS Studio and PuTTY Plink
        shell: pwsh
        run: choco install obs-studio putty -y --no-progress

      - name: Install and start MonaServer RTMP ingest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # MonaServer's official Windows archive is pinned by SHA-256. The upstream
          # README recommends building from source for production; this archived
          # binary is used here for the temporary GitHub-hosted test runner.
          $archive = Join-Path $env:RUNNER_TEMP 'MonaServer_Win64.zip'
          $installDir = Join-Path $env:RUNNER_TEMP 'MonaServer'
          $downloadUrl = 'https://downloads.sourceforge.net/project/monaserver/MonaServer/MonaServer_Win64.zip'
          $expectedSha256 = '905504b6e2cdcb8a066e0f37e3bacdcbaea523d1fefb550b733a7e11c89b5157'

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archive
          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "MonaServer archive checksum mismatch: expected $expectedSha256 but received $actualSha256."
          }

          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          Expand-Archive -Path $archive -DestinationPath $installDir -Force
          $serverExe = Join-Path $installDir 'MonaServer.exe'
          if (-not (Test-Path $serverExe)) {
            throw 'MonaServer.exe was not present in the verified Windows archive.'
          }

          # Only expose RTMP on loopback; the public route is created by Pinggy.
          # Other bundled listeners are disabled to minimize the local surface.
          $config = @'
          [HTTP]
          port=0
          [HTTPS]
          port=0
          [RTMP]
          port=1935
          host=127.0.0.1
          publicPort=1935
          publicHost=127.0.0.1
          [RTMPS]
          port=0
          [RTMFP]
          port=0
          [RTSP]
          port=0
          '@
          Set-Content -Path (Join-Path $installDir 'MonaServer.ini') -Value $config -Encoding ascii
          New-Item -ItemType Directory -Path (Join-Path $installDir 'www\live') -Force | Out-Null

          $mona = Start-Process -FilePath $serverExe -WorkingDirectory $installDir -WindowStyle Hidden -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 1
            $listener = Get-NetTCPConnection -LocalPort 1935 -State Listen -ErrorAction SilentlyContinue
            $mona.Refresh()
            if ($mona.HasExited) {
              throw "MonaServer exited before opening RTMP TCP 1935 (exit code $($mona.ExitCode))."
            }
          } while (-not $listener -and (Get-Date) -lt $deadline)

          if (-not $listener) {
            throw 'MonaServer did not listen on local TCP 1935 within 30 seconds.'
          }
          Write-Host 'MonaServer RTMP is listening on 127.0.0.1:1935.'

      - name: Configure Windows Remote Desktop
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw 'Missing GitHub Actions secret RDP_PASSWORD. Add a new, unique password in repository Settings > Secrets and variables > Actions.'
          }

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1

          & net.exe user runneradmin "$env:RDP_PASSWORD" /active:yes
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not set the runneradmin password.'
          }

          $termService = Get-Service -Name TermService
          if ($termService.Status -ne 'Running') {
            Start-Service -Name TermService
          }
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $rdpListener = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
            if ($rdpListener) { break }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)

          if (-not $rdpListener) {
            throw 'Remote Desktop is not listening on TCP port 3389.'
          }
          Write-Host 'RDP is listening locally on TCP 3389.'

      - name: Keep reconnecting RDP and RTMP Pinggy tunnels until runner timeout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $plinkPath = (Get-Command plink.exe -ErrorAction Stop).Source
          $hostKey = 'SHA256:nFd5rfJMGuZXvfeRzJ/BtT3TfksAxTWMajcrHRcI7AM'
          $passwordFile = Join-Path $env:RUNNER_TEMP 'pinggy-auth.txt'
          Set-Content -Path $passwordFile -Value '0000' -NoNewline -Encoding ascii

          if (-not (Get-NetTCPConnection -LocalPort 1935 -State Listen -ErrorAction SilentlyContinue)) {
            throw 'MonaServer is not listening on TCP 1935; refusing to open the RTMP tunnel.'
          }

          Write-Host 'WARNING: RDP and RTMP are being forwarded to temporary public TCP endpoints.'
          Write-Host 'Pinggy Free sessions expire after about 60 minutes; each reconnect can change hostname and port.'
          Write-Host 'RDP clients must reconnect to the newest RDP endpoint. DJI Fly must stop/restart its RTMP stream using the newest RTMP endpoint.'
          Write-Host 'The runner will stay active until the GitHub job timeout (maximum 6 hours), unless canceled or a worker cannot start.'
          Write-Host 'The two free Pinggy sessions are separate; Pinggy does not document that anonymous concurrent sessions are guaranteed.'
          Write-Host 'RTMP URL format: rtmp://<RTMP-host>:<RTMP-port>/live/<your-stream-name>. The stream name is not server-side authentication.'
          Write-Host 'Pinggy SSH auth uses its documented dummy password 0000; this is not the Windows RDP password.'

          @'
          ### Temporary remote access
          - Runner lifetime: at most 6 hours; this workflow retries each tunnel until the job timeout.
          - RDP and RTMP use separate temporary Pinggy endpoints. Follow the live logs for the newest `tcp://host:port` for each label.
          - Free endpoints can expire after about 60 minutes and rotate. RDP must reconnect; the DJI RTMP stream must be restarted with the new RTMP host and port.
          - DJI Fly: server address `rtmp://<RTMP-host>:<RTMP-port>/live`; stream key/name: choose a long, unpredictable value. MonaServer treats this as a stream path, not a password.
          - MonaServer receives RTMP on local TCP 1935. OBS can read `rtmp://127.0.0.1:1935/live/<stream-name>`.
          '@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

          $tunnelWorker = {
            param(
              [string]$PlinkPath,
              [string]$RemotePort,
              [string]$PasswordFile,
              [string]$HostKey,
              [string]$TunnelName
            )

            $attempt = 0
            $retryDelay = 5
            while ($true) {
              $attempt++
              Write-Output "[$TunnelName] Starting Pinggy attempt $attempt for local TCP $RemotePort..."
              $startedAt = Get-Date
              $plinkArguments = @(
                '-ssh',
                '-P', '443',
                '-R', ("{0}:localhost:{0}" -f $RemotePort),
                '-hostkey', $HostKey,
                '-pwfile', $PasswordFile,
                '-T',
                '-batch',
                '-no-antispoof',
                '-v',
                'auth+tcp@free.pinggy.io'
              )

              & $PlinkPath @plinkArguments 2>&1 | ForEach-Object {
                Write-Output "[$TunnelName] $_"
              }
              $exitCode = $LASTEXITCODE
              $elapsedMinutes = ((Get-Date) - $startedAt).TotalMinutes
              if ($elapsedMinutes -ge 10) {
                $retryDelay = 5
              } else {
                $retryDelay = [Math]::Min(60, $retryDelay * 2)
              }
              Write-Output "[$TunnelName] Plink exited with code $exitCode; retrying in $retryDelay seconds. A new endpoint may be assigned."
              Start-Sleep -Seconds $retryDelay
            }
          }

          $tunnels = @(
            [pscustomobject]@{ Name = 'RDP'; Port = '3389' },
            [pscustomobject]@{ Name = 'RTMP'; Port = '1935' }
          )
          $tunnelJobs = @{}

          function Start-TunnelWorker {
            param($Tunnel)
            Start-Job -Name "Pinggy-$($Tunnel.Name)" -ScriptBlock $tunnelWorker -ArgumentList @(
              $plinkPath,
              [string]$Tunnel.Port,
              $passwordFile,
              $hostKey,
              $Tunnel.Name
            )
          }

          try {
            foreach ($tunnel in $tunnels) {
              $tunnelJobs[$tunnel.Name] = Start-TunnelWorker -Tunnel $tunnel
            }

            # Keep the parent step alive. GitHub's 360-minute job timeout ends
            # the runner; tunnel workers restart their SSH sessions as needed.
            while ($true) {
              foreach ($tunnel in $tunnels) {
                $job = $tunnelJobs[$tunnel.Name]
                Receive-Job -Job $job -ErrorAction SilentlyContinue 2>&1 | ForEach-Object {
                  Write-Host $_.ToString()
                }

                if ($job.State -in @('Completed', 'Failed', 'Stopped')) {
                  Write-Host "[$($tunnel.Name)] Tunnel worker exited unexpectedly; restarting its worker."
                  Remove-Job -Job $job -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 5
                  $tunnelJobs[$tunnel.Name] = Start-TunnelWorker -Tunnel $tunnel
                }
              }
              Start-Sleep -Seconds 2
            }
          }
          finally {
            foreach ($job in $tunnelJobs.Values) {
              Stop-Job -Job $job -ErrorAction SilentlyContinue
              Remove-Job -Job $job -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -Path $passwordFile -Force -ErrorAction SilentlyContinue
          }
