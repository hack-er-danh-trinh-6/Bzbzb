name: Automated-DJI-Streaming-Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  media-processing:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Install System Dependencies (Chocolatey)
      run: |
        choco install obs-studio -y

    - name: Enable Windows Remote Desktop Configuration
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Configure System Access Password
      run: |
        net user runneradmin RdpPassword2026! /active:yes

    - name: Deploy Light RTMP Server
      run: |
        Write-Host "Setting up live broadcast pipeline ports..."
        New-Item -ItemType Directory -Force -Path "C:\StreamingServer"

    - name: Inject Virtual Graphics Driver for OBS Studio
      run: |
        $obsBinPath = "C:\Program Files\obs-studio\bin\64bit"
        if (!(Test-Path $obsBinPath)) { New-Item -ItemType Directory -Force -Path $obsBinPath }
        $dllUrl = "https://githubusercontent.com"
        try {
            Invoke-WebRequest -Uri $dllUrl -OutFile "$obsBinPath\opengl32.dll" -TimeoutSec 60
            Write-Host "Virtual Graphics Driver integrated successfully."
        } catch {
            Write-Host "Software emulation pipeline active."
        }

    - name: Start Network Services Gateway (HẠ TẦNG BORE KHÔNG LỖI ZIP)
      run: |
        echo "----------------------------------------------------------------------"
        echo "HỆ THỐNG ĐANG TỰ ĐỘNG CẤP PHÁT PUBLIC IP QUA BORE TUNNEL..."
        echo "----------------------------------------------------------------------"
        
        # Ép nạp cấu hình mạng an toàn
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        
        # Tải trực tiếp file thực thi .exe của Bore từ máy chủ CDN sạch, KHÔNG CẦN GIẢI NÉN
        Invoke-WebRequest -Uri "https://github.com" -OutFile "bore.exe"
        
        # Khởi chạy hầm mạng công khai kết nối thẳng tới máy chủ tự do bore.pub
        # Tự động gán cổng ngẫu nhiên cho RDP (3389) và RTMP (1935)
        Start-Process "bore.exe" -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput "rdp_bore.log"
        Start-Process "bore.exe" -ArgumentList "local 1935 --to bore.pub" -RedirectStandardOutput "rtmp_bore.log"
        
        # Chờ 12 giây để mạng đám mây đồng bộ luồng
        Start-Sleep -Seconds 12
        
        echo "=================== ĐỊA CHỈ KẾT NỐI CỦA BẠN ==================="
        if (Test-Path rdp_bore.log) {
            echo "THÔNG TIN CỔNG RDP (DÙNG ĐỂ VÀO ĐIỀU KHIỂN OBS):"
            Get-Content rdp_bore.log | Select-String "listening at"
        }
        echo "---------------------------------------------------------------"
        if (Test-Path rtmp_bore.log) {
            echo "THÔNG TIN CỔNG RTMP (NHẬP VÀO TAY CẦM DJI MINI 3):"
            $rtmpRaw = Get-Content rtmp_bore.log | Select-String "listening at"
            if ($rtmpRaw) {
                # Trích xuất số cổng từ chuỗi log của Bore để chuyển đổi thành link RTMP chuẩn
                echo "Vui lòng lấy địa chỉ bore.pub:XXXXX ứng với log rtmp dưới đây,"
                echo "sau đó đổi thành định dạng rtmp://bore.pub:XXXXX/live/dji_stream để nhập vào drone."
                echo $rtmpRaw
            }
        }
        echo "==============================================================="
        
        # Giữ máy ảo Windows Server hoạt động liên tục trong 6 tiếng để thực hiện Livestream
        Start-Sleep -Seconds 21600
