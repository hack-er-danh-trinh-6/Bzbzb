name: Automated-DJI-Streaming-Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  media-processing:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Install System Dependencies (Chocolatey)
      run: |
        choco install obs-studio localxpose -y

    - name: Enable Windows Remote Desktop Configuration
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Configure System Access Password
      run: |
        net user runneradmin RdpPassword2026! /active:yes

    - name: Deploy Light RTMP Server
      run: |
        Write-Host "Setting up live broadcast pipeline ports..."
        New-Item -ItemType Directory -Force -Path "C:\StreamingServer"

    - name: Inject Virtual Graphics Driver for OBS Studio
      run: |
        $obsBinPath = "C:\Program Files\obs-studio\bin\64bit"
        if (!(Test-Path $obsBinPath)) { New-Item -ItemType Directory -Force -Path $obsBinPath }
        $dllUrl = "https://githubusercontent.com"
        try {
            Invoke-WebRequest -Uri $dllUrl -OutFile "$obsBinPath\opengl32.dll" -TimeoutSec 60
            Write-Host "Virtual Graphics Driver integrated successfully."
        } catch {
            Write-Host "Software emulation pipeline active."
        }

    - name: Start Network Services Gateway (SỬA LỖI BIẾN XÁC THỰC)
      run: |
        echo "----------------------------------------------------------------------"
        echo "HỆ THỐNG ĐANG KHỞI TẠO ĐƯỜNG TRUYỀN QUA LOCALXPOSE..."
        echo "----------------------------------------------------------------------"
        
        # Đ FIXED: Sửa tên biến môi trường thành LOCLX_ACCESS_TOKEN theo đúng chuẩn tài liệu nhà phát hành
        $env:LOCLX_ACCESS_TOKEN = "${{ secrets.LOCALXPOSE_TOKEN }}"
        
        # Kích hoạt hầm mạng công khai TCP hướng máy chủ Singapore (ap) về Việt Nam mượt nhất
        Start-Process loclx -ArgumentList "tunnel tcp -t 3389 -g ap" -RedirectStandardOutput "rdp_tunnel.log" -RedirectStandardError "rdp_err.log"
        Start-Process loclx -ArgumentList "tunnel tcp -t 1935 -g ap" -RedirectStandardOutput "rtmp_tunnel.log" -RedirectStandardError "rtmp_err.log"
        
        # Chờ 15 giây để hệ thống máy chủ đám mây LocalXpose thiết lập cổng Public
        Start-Sleep -Seconds 15
        
        echo "=================== ĐỊA CHỈ KẾT NỐI CHÍNH THỨC CỦA BẠN ==================="
        echo "--- THÔNG TIN ĐƯỜNG HẦM RDP (KẾT NỐI ĐIỀU KHIỂN OBS): ---"
        if (Test-Path rdp_tunnel.log) { Get-Content rdp_tunnel.log }
        echo "------------------------------------------------------------------"
        echo "--- THÔNG TIN ĐƯỜNG HẦM RTMP (NHẬP VÀO TAY CẦM DJI MINI 3): ---"
        if (Test-Path rtmp_tunnel.log) {
            $rtmpRaw = Get-Content rtmp_tunnel.log
            echo "Dia chi tho: $rtmpRaw"
        }
        echo "=========================================================================="
        echo "--- KÊNH KIỂM TRA LOG HỆ THỐNG (NẾU CÓ LỖI) ---"
        if (Test-Path rdp_err.log) { Get-Content rdp_err.log }
        if (Test-Path rtmp_err.log) { Get-Content rtmp_err.log }
        
        # Giữ máy ảo Windows Server hoạt động liên tục trong 6 tiếng để thực hiện Livestream
        Start-Sleep -Seconds 21600
