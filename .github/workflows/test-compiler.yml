name: Core-Service-Pipeline

on: 
  workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest # Chuyển sang Linux để hệ thống siêu nhẹ và tiết kiệm RAM
    timeout-minutes: 360 

    steps:
    - name: Cài đặt Ngrok bằng Snap
      run: |
        sudo snap install ngrok
        
    - name: Tải và cấu hình Giao diện điều khiển Stream (Owncast)
      run: |
        # Tải bộ công cụ phát trực tuyến có giao diện Web quản lý siêu nhẹ
        curl -s https://owncast.online | bash
        
    - name: Khởi chạy giao diện điều khiển ngầm
      run: |
        # Chạy Owncast trên cổng 8080 của máy ảo
        cd owncast && ./owncast &
        
    - name: Kích hoạt đường hầm Web Panel công khai (Sửa lỗi quyền)
      run: |
        echo "------------------------------------------------------------"
        echo "Hệ thống đang khởi tạo Giao diện điều khiển Web..."
        echo "Vui lòng truy cập https://ngrok.com để lấy link Web"
        echo "------------------------------------------------------------"
        # Mở cổng giao diện Web 8080 thông qua Ngrok có add thẻ của bạn
        sudo ngrok http 8080 --authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
