name: Test-Ngrok-RDP-Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-tunnel:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

    steps:
      - name: Install ngrok
        shell: pwsh
        run: |
          choco install ngrok -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Cài đặt ngrok thất bại."
          }

      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Thiếu secret RDP_PASSWORD trong GitHub Secrets."
          }

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          $password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $user = Get-LocalUser -Name 'runneradmin' -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name 'runneradmin' `
              -Password $password `
              -Description 'Temporary RDP user'
          } else {
            Set-LocalUser -Name 'runneradmin' -Password $password
          }

          Enable-LocalUser -Name 'runneradmin'

      - name: Start ngrok tunnel
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTHTOKEN)) {
            throw "Thiếu secret NGROK_AUTHTOKEN trong GitHub Secrets."
          }

          $configPath = Join-Path$env:RUNNER_TEMP 'ngrok.yml'

          $config = @"
          version: 3
          agent:
            authtoken: $env:NGROK_AUTHTOKEN
          endpoints:
            - name: rdp-tunnel
              url: tcp://
              upstream:
                url: 3389
          "@

          [System.IO.File]::WriteAllText(
            $configPath,$config,
            [System.Text.UTF8Encoding]::new($false)
          )

          ngrok config check --config $configPath
          if ($LASTEXITCODE -ne 0) {
            throw "Cấu hình ngrok không hợp lệ."
          }

          Write-Host "Đang khởi chạy ngrok... Hãy xem log bên dưới để lấy địa chỉ TCP!"
          ngrok start --config $configPath --log stdout --log-format logfmt rdp-tunnel
