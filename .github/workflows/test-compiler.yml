name: Automated-DJI-Streaming-Pipeline

on: 
  workflow_dispatch: 

jobs:
  media-processing:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: Install System Dependencies (Chocolatey)
      run: |
        # Cài đặt chính thức công cụ điều khiển và streaming
        choco install ngrok obs-studio -y

    - name: Enable Windows Remote Desktop Configuration
      run: |
        # Kích hoạt hệ thống RDP để bạn có thể vào cấu hình OBS bằng mắt thường
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Configure System Access Password
      run: |
        # Tạo mật khẩu đăng nhập máy ảo (Tài khoản mặc định: runneradmin)
        net user runneradmin RdpPassword2026! /active:yes

    - name: Deploy Local RTMP Server (MonaServer Direct Link)
      run: |
        Write-Host "Downloading core media infrastructure components..."
        # ĐÃ SỬA: Thay thế link trang chủ bằng Link tải trực tiếp từ máy chủ SourceForge
        $monaUrl = "https://sourceforge.net"
        Invoke-WebRequest -Uri $monaUrl -OutFile "MonaServer.zip"
        Expand-Archive -Path "MonaServer.zip" -DestinationPath "MonaServer"
        
        # Khởi chạy MonaServer để lắng nghe cổng 1935
        Start-Process -FilePath "MonaServer\MonaServer.exe" -WindowStyle Hidden
        Write-Host "MonaServer is active and listening on port 1935."

    - name: Inject Virtual Graphics Driver & Virtual Display for OBS Studio
      run: |
        # ĐÃ SỬA: Tải driver opengl32 từ kho lưu trữ thực tế để OBS chạy được trên môi trường không màn hình
        $obsBinPath = "C:\Program Files\obs-studio\bin\64bit"
        if (!(Test-Path $obsBinPath)) { New-Item -ItemType Directory -Force -Path $obsBinPath }
        
        $dllUrl = "https://githubusercontent.com"
        try {
            Invoke-WebRequest -Uri $dllUrl -OutFile "$obsBinPath\opengl32.dll" -TimeoutSec 60
            Write-Host "Virtual Graphics Driver integrated successfully."
        } catch {
            Write-Host "Warning: Could not fetch virtual GPU driver, falling back to software emulation."
        }

    - name: Create Multi-Tunnel Configuration File
      run: |
        # Cấu hình định tuyến cổng về máy chủ Singapore (sg) để giảm ping tối đa từ Việt Nam
        $config = @"
        version: "3"
        agent:
          authtoken: "${{ secrets.NGROK_AUTH_TOKEN }}"
        tunnels:
          rdp-tunnel:
            proto: tcp
            addr: 3389
            region: sg
          rtmp-tunnel:
            proto: tcp
            addr: 1935
            region: sg
        "@
        Set-Content -Path "ngrok_config.yml" -Value $config

    - name: Start Network Services Gateway
      run: |
        echo "----------------------------------------------------------------------"
        echo "IP PUBLIC GATEWAY IS ACTIVE VIA SINGAPORE SERVER"
        echo "Vào Ngrok Dashboard (https://ngrok.com) để lấy IP"
        echo "Tài khoản RDP: runneradmin | Mật khẩu: RdpPassword2026!"
        echo "----------------------------------------------------------------------"
        
        # Chạy đồng bộ cả 2 cổng Public ra Internet
        ngrok start --config ngrok_config.yml --all
