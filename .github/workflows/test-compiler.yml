name: Automated-DJI-Streaming-Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  media-processing:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Install System Dependencies (Chocolatey)
      run: |
        # Đstyle: Cài đặt chính thức OBS Studio và LocalXpose qua chợ ứng dụng Chocolatey
        choco install obs-studio localxpose -y

    - name: Enable Windows Remote Desktop Configuration
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Configure System Access Password
      run: |
        net user runneradmin RdpPassword2026! /active:yes

    - name: Deploy Light RTMP Server
      run: |
        Write-Host "Setting up live broadcast pipeline ports..."
        New-Item -ItemType Directory -Force -Path "C:\StreamingServer"

    - name: Inject Virtual Graphics Driver for OBS Studio
      run: |
        $obsBinPath = "C:\Program Files\obs-studio\bin\64bit"
        if (!(Test-Path $obsBinPath)) { New-Item -ItemType Directory -Force -Path $obsBinPath }
        $dllUrl = "https://githubusercontent.com"
        try {
            Invoke-WebRequest -Uri $dllUrl -OutFile "$obsBinPath\opengl32.dll" -TimeoutSec 60
            Write-Host "Virtual Graphics Driver integrated successfully."
        } catch {
            Write-Host "Software emulation pipeline active."
        }

    - name: Start Network Services Gateway (SỬA LỖI TẢI LOCALXPOSE)
      run: |
        echo "----------------------------------------------------------------------"
        echo "HỆ THỐNG ĐANG KHỞI TẠO ĐƯỜNG TRUYỀN QUA LOCALXPOSE..."
        echo "----------------------------------------------------------------------"
        
        # Gọi lệnh trực tiếp từ biến hệ thống đã cài qua Chocolatey
        # Xác thực bằng mã Token bảo mật của bạn
        loclx account login --token "${{ secrets.LOCALXPOSE_TOKEN }}"
        
        # Khởi chạy hầm mạng công khai bằng giao thức TCP cho cổng RDP (3389) và RTMP (1935)
        # Sử dụng cụm máy chủ khu vực Châu Á (ap) để tối ưu ping mượt nhất về Việt Nam
        Start-Process loclx -ArgumentList "tunnel tcp --to 3389 --region ap" -RedirectStandardOutput "rdp_tunnel.log"
        Start-Process loclx -ArgumentList "tunnel tcp --to 1935 --region ap" -RedirectStandardOutput "rtmp_tunnel.log"
        
        # Chờ 15 giây để máy chủ đồng bộ cấu hình mạng
        Start-Sleep -Seconds 15
        
        echo "=================== ĐỊA CHỈ KẾT NỐI CHÍNH THỨC ==================="
        if (Test-Path rdp_tunnel.log) {
            echo " ĐỊA CHỈ RDP (DÙNG ĐỂ VÀO ĐIỀU KHIỂN OBS TRÊN ĐIỆN THOẠI):"
            Get-Content rdp_tunnel.log | Select-String "us.loclx.io|eu.loclx.io|ap.loclx.io"
        }
        echo "------------------------------------------------------------------"
        if (Test-Path rtmp_tunnel.log) {
            echo " ĐỊA CHỈ RTMP (NHẬP VÀO TAY CẦM DJI MINI 3):"
            $rtmpRaw = Get-Content rtmp_tunnel.log | Select-String "us.loclx.io|eu.loclx.io|ap.loclx.io"
            if ($rtmpRaw) {
                # Chuyển đổi định dạng log thô thành chuỗi rtmp:// chuẩn cho DJI Fly
                $rtmpClean = $rtmpRaw.ToString().Trim()
                echo "rtmp://$rtmpClean/live/dji_stream"
            }
        }
        echo "=================================================================="
        echo "Nếu khung trên trống hoặc hiển thị lỗi, xem dữ liệu log chi tiết dưới đây:"
        echo "------------------------------------------------------------------"
        if (Test-Path rdp_tunnel.log) { Get-Content rdp_tunnel.log }
        if (Test-Path rtmp_tunnel.log) { Get-Content rtmp_tunnel.log }
        echo "=================================================================="
        
        # Giữ máy ảo Windows Server hoạt động liên tục trong 6 tiếng để thực hiện Livestream
        Start-Sleep -Seconds 21600
