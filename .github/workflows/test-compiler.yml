name: Automated-DJI-Streaming-Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  media-processing:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Cài đặt phần mềm Hệ thống (Chocolatey)
      run: |
        choco install obs-studio anydesk -y

    - name: Cấu hình Mật khẩu truy cập AnyDesk ngầm
      run: |
        Write-Host "Setting up AnyDesk unattended access password..."
        # Đảm bảo service của AnyDesk đã chạy trước khi set mật khẩu
        Start-Service -Name "AnyDesk" -ErrorAction SilentlyContinue
        echo RdpPassword2026! | & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --set-password
        
    - name: Deploy Light RTMP Server
      run: |
        Write-Host "Setting up live broadcast pipeline ports..."
        New-Item -ItemType Directory -Force -Path "C:\StreamingServer"

    - name: Inject Virtual Graphics Driver for OBS Studio
      run: |
        $obsBinPath = "C:\Program Files\obs-studio\bin\64bit"
        if (!(Test-Path $obsBinPath)) { New-Item -ItemType Directory -Force -Path $obsBinPath }
        $dllUrl = "https://githubusercontent.com"
        try {
            Invoke-WebRequest -Uri $dllUrl -OutFile "$obsBinPath\opengl32.dll" -TimeoutSec 60
            Write-Host "Virtual Graphics Driver integrated successfully."
        } catch {
            Write-Host "Software emulation pipeline active."
        }

    - name: Kích hoạt AnyDesk và Quét mã ID liên tục
      run: |
        echo "----------------------------------------------------------------------"
        echo "HỆ THỐNG ĐANG KHỞI CHẠY ANYDESK VÀ ĐỢI MÁY CHỦ CẤP MÃ ID..."
        echo "----------------------------------------------------------------------"
        
        # Đường dẫn file chạy AnyDesk chính thức
        $anydeskPath = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
        
        # Vòng lặp quét liên tục trong tối đa 60 giây để chờ lấy bằng được ID
        $timeout = 60
        $anydeskId = ""
        
        while ($timeout -gt 0) {
            # Gọi lệnh lấy ID của AnyDesk và lưu ra biến tạm
            $anydeskId = & $anydeskPath --get-id 2>$null
            
            # Làm sạch chuỗi dữ liệu nhận được (xóa khoảng trắng hoặc ký tự xuống dòng)
            if ($anydeskId) { $anydeskId = $anydeskId.Trim() }
            
            # Nếu đã có chuỗi ID (thường gồm 9 chữ số), thoát vòng lặp
            if ($anydeskId -match '^\d+$' -or ($anydeskId -and $anydeskId.Length -ge 9)) {
                break
            }
            
            Start-Sleep -Seconds 2
            $timeout -= 2
        }
        
        echo "=================== THÔNG TIN KẾT NỐI ANYDESK ==================="
        if ($anydeskId) {
            echo "MÃ SỐ ID ANYDESK MÁY ẢO CỦA BẠN LÀ: $anydeskId"
        } else {
            echo "LỖI: Máy chủ AnyDesk phản hồi quá chậm. Vui lòng bấm vào nút 'Re-run jobs' trên GitHub để thử lại."
        }
        echo "MẬT KHẨU TRUY CẬP (PASSWORD): RdpPassword2026!"
        echo "================================================================="
        
        # Giữ máy ảo Windows Server hoạt động liên tục trong 6 tiếng để thực hiện Livestream
        Start-Sleep -Seconds 21600
