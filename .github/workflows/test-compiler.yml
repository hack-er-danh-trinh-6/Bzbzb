name: Automated-DJI-Streaming-Pipeline

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: 'Mã code từ remotedesktop.google.com/headless'
        required: true

permissions:
  contents: read

jobs:
  media-processing:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

    steps:
      - name: Install and register Chrome Remote Desktop
        shell: pwsh
        env:
          CRD_CODE: ${{ inputs.crd_code }}
          CRD_PIN: "123456"
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CRD_CODE)) {
            throw "Thiếu crd_code."
          }
          if ([string]::IsNullOrWhiteSpace($env:CRD_PIN) -or $env:CRD_PIN.Length -lt 6) {
            throw "Secret CRD_PIN thiếu hoặc ngắn hơn 6 ký tự."
          }

          Invoke-WebRequest `
            -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
            -OutFile "$env:RUNNER_TEMP\crd.msi"

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$env:RUNNER_TEMP\crd.msi`" /qn /norestart" `
            -Wait

          $exe = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (-not (Test-Path $exe)) {
            throw "Không tìm thấy remoting_start_host.exe sau khi cài."
          }

          & $exe `
            --code="$env:CRD_CODE" `
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" `
            --name=$Env:COMPUTERNAME `
            --pin="$env:CRD_PIN"

          if ($LASTEXITCODE -ne 0) {
            throw "Đăng ký Chrome Remote Desktop thất bại (mã hết hạn hoặc đã dùng)."
          }

      - name: Install tools and Android Studio
        shell: pwsh
        run: |
          choco install ngrok obs-studio androidstudio -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Cài đặt công cụ thất bại."
          }

          if (-not (Get-Command ngrok -ErrorAction SilentlyContinue)) {
            throw "Không tìm thấy ngrok sau khi cài."
          }

          Write-Host "Cài đặt hoàn tất ngrok, OBS Studio và Android Studio!"

      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Thiếu GitHub Actions secret RDP_PASSWORD."
          }

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          $password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $user = Get-LocalUser -Name 'runneradmin' -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name 'runneradmin' `
              -Password $password `
              -Description 'Temporary RDP user for this workflow'
          } else {
            Set-LocalUser -Name 'runneradmin' -Password $password
          }

          Enable-LocalUser -Name 'runneradmin'

      - name: Create ngrok TCP config and start tunnel
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTHTOKEN)) {
            throw "Thiếu GitHub Actions secret NGROK_AUTHTOKEN."
          }

          $configPath = Join-Path$env:RUNNER_TEMP 'ngrok.yml'

          $config = @"
          version: 3
          agent:
            authtoken: $env:NGROK_AUTHTOKEN
          endpoints:
            - name: rdp-tunnel
              url: tcp://
              upstream:
                url: 3389
          "@

          [System.IO.File]::WriteAllText(
            $configPath,$config,
            [System.Text.UTF8Encoding]::new($false)
          )

          ngrok config check --config $configPath
          if ($LASTEXITCODE -ne 0) {
            throw "ngrok config check thất bại."
          }

          ngrok start --config $configPath --log stdout --log-format logfmt rdp-tunnel
          if ($LASTEXITCODE -ne 0) {
            throw "ngrok thoát với lỗi."
          }
