name: OBS-Auto-Livestream

on: 
  workflow_dispatch: 

jobs:
  stream:
    runs-on: windows-latest # Sử dụng Windows để tối ưu bộ mã hóa Render của OBS
    timeout-minutes: 360 

    steps:
    - name: Cài đặt OBS Studio bằng Chocolatey
      run: |
        choco install obs-studio -y
        
    - name: Tự động cấu hình luồng Stream (Không cần mở màn hình)
      run: |
        # Lệnh này tự động điền Stream Key và Server của bạn vào cấu hình OBS ngầm
        $obsPath = "$env:APPDATA\obs-studio\basic\profiles\Untitled"
        if (!(Test-Path $obsPath)) { New-Item -ItemType Directory -Force -Path $obsPath }
        
        # Thiết lập cấu hình phát Live (Thay bằng Stream Key của bạn)
        $config = @"
        [Service]
        Type=rtmp_common
        URL=rtmp://://youtube.com
        Key=ĐIỀN_STREAM_KEY_YOUTUBE_HOẶC_TIKTOK_CỦA_BẠN_VÀO_ĐÂY
        "@
        Set-Content -Path "$obsPath\service.json" -Value $config

    - name: Khởi chạy OBS và Tự động Phát Live trực tiếp
      run: |
        Write-Host "Đang bật OBS Studio và tự động phát luồng Live..."
        # Mở OBS chạy ngầm ở chế độ ẩn màn hình RDP để tiết kiệm 80% tài nguyên CPU
        Start-Process "C:\Program Files\obs-studio\bin\64bit\obs64.exe" -ArgumentList "--startstreaming", "--minimize-to-tray"
        
    - name: Duy trì luồng Live (Vòng lặp 6 tiếng)
      run: |
        $count = 0
        while ($count -lt 360) {
            Start-Sleep -Seconds 60
            $count++
            Write-Host "Luồng Livestream đang hoạt động ổn định... Phút thứ: $count"
        }
