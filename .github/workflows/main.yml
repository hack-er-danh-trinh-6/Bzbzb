name: Windows-RDP

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: Cài đặt Ngrok bằng Chocolatey
      run: |
        choco install ngrok -y
        
    - name: Xác thực tài khoản Ngrok
      run: |
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        
    - name: Kích hoạt tính năng Remote Desktop trên Windows
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Khởi tạo mật khẩu mới cho hệ thống (Bản sửa lỗi)
      run: |
        # Đặt trực tiếp mật khẩu mạnh, đáp ứng đầy đủ chính sách bảo mật Windows của GitHub
        net user runneradmin RdpPassword2026! /active:yes
        
    - name: Khởi tạo và Duy trì đường truyền RDP
      run: |
        Write-Host "Đang kích hoạt đường hầm kết nối Ngrok..."
        ngrok tcp 3389
