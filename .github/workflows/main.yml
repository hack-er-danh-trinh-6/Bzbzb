name: Windows-RDP

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: Cài đặt Ngrok bằng Chocolatey
      run: |
        choco install ngrok -y
        
    - name: Xác thực tài khoản Ngrok
      run: |
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        
    - name: Kích hoạt tính năng Remote Desktop trên Windows
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Cập nhật mật khẩu tài khoản Admin hệ thống
      run: |
        $Password = ConvertTo-SecureString "RdpPassword2026!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue
        
    - name: Khởi tạo và Duy trì đường truyền RDP (Bản sửa lỗi)
      run: |
        Write-Host "Đang kích hoạt đường hầm kết nối Ngrok tại khu vực Châu Á (AP)..."
        # Chạy trực tiếp ngrok tcp tại cổng 3389 và bắt đầu vòng lặp giữ live
        ngrok tcp 3389 --region ap
