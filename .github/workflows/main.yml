name: Ubuntu-Desktop-RDP

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest # Chạy trên môi trường Ubuntu mới nhất (24.04)
    timeout-minutes: 360 

    steps:
    - name: Cài đặt Ngrok bằng Snap (Sửa lỗi giải nén)
      run: |
        sudo snap install ngrok
        
    - name: Xác thực tài khoản Ngrok
      run: |
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        
    - name: Cài đặt Môi trường đồ họa nhẹ và XRDP
      run: |
        sudo apt update
        # Tự động đồng ý cài đặt giao diện XFCE4 và công cụ điều khiển XRDP
        sudo DEBIAN_FRONTEND=noninteractive apt install xfce4 xfce4-goodies xrdp -y
        # Thiết lập cấu hình hệ thống nhận diện giao diện đồ họa khi đăng nhập
        echo xfce4-session > ~/.xsession
        sudo systemctl restart xrdp
        
    - name: Thiết lập Mật khẩu đăng nhập cho hệ thống
      run: |
        # Đặt mật khẩu của tài khoản 'runner' mặc định thành 'RdpPassword2026!'
        echo "runner:RdpPassword2026!" | sudo chpasswd
        
    - name: Khởi tạo và Duy trì đường truyền RDP trên Ubuntu
      run: |
        echo "------------------------------------------------------------"
        echo "Đang kích hoạt đường hầm RDP công khai cho Ubuntu..."
        echo "Vui lòng lấy IP kết nối mới tại: https://ngrok.com"
        echo "------------------------------------------------------------"
        # Mở cổng kết nối đồ họa 3389 qua ngrok
        ngrok tcp 3389
