name: Windows-RDP-OBS-Graphics

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: Cài đặt Ngrok và OBS Studio bằng Chocolatey
      run: |
        choco install ngrok obs-studio -y
        
    - name: Xác thực tài khoản Ngrok
      run: |
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        
    - name: Kích hoạt tính năng Remote Desktop trên Windows
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Cấu hình tài khoản đăng nhập hệ thống
      run: |
        net user runneradmin RdpPassword2026! /active:yes
        
    - name: Cài đặt Card đồ họa ảo (Mesa 3D OpenGL) cho OBS
      run: |
        Write-Host "Đang tải và cấu hình Driver đồ họa ảo OpenGL..."
        # Tải file driver opengl32.dll từ kho lưu trữ Mesa3D chính thức về máy
        Invoke-WebRequest -Uri "https://github.com" -OutFile "mesa3d.7z"
        choco install 7zip -y
        & "C:\Program Files\7-Zip\7z.exe" x mesa3d.7z -o"mesa3d"
        
        # Copy file card đồ họa ảo opengl32.dll trực tiếp vào thư mục chạy của OBS Studio
        Copy-Item "mesa3d\x64\opengl32.dll" -Destination "C:\Program Files\obs-studio\bin\64bit\"
        Write-Host "Cài đặt Driver đồ họa ảo thành công!"

    - name: Khởi tạo Tunnel kết nối đường truyền RDP
      run: |
        Start-Process ngrok -ArgumentList "tcp 3389"
        Write-Host "Vui lòng truy cập https://ngrok.com để kiểm tra IP kết nối RDP"
        
    - name: Duy trì kết nối live (Vòng lặp chạy ngầm)
      run: |
        $count = 0
        while ($count -lt 360) {
            Start-Sleep -Seconds 60
            $count++
            Write-Host "Đang giữ phiên RDP hoạt động ổn định... Phút thứ: $count"
        }
