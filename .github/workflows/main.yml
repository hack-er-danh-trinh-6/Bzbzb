name: Windows-RDP

on: 
  workflow_dispatch: # Cho phép bạn chủ động bấm nút kích hoạt chạy RDP thủ công bằng tay

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 # Giới hạn tối đa 6 tiếng (360 phút) cho mỗi phiên chạy theo quy định của GitHub

    steps:
    - name: Cài đặt Ngrok bằng Chocolatey
      run: |
        choco install ngrok -y
        
    - name: Xác thực tài khoản Ngrok
      run: |
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        
    - name: Kích hoạt tính năng Remote Desktop trên Windows
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Thiết lập Tài khoản đăng nhập RDP
      run: |
        $Password = ConvertTo-SecureString "${{ secrets.USER_PASSWORD }}" -AsPlainText -Force
        New-LocalUser "runneradmin" -Password $Password -Description "RDP Admin"
        Add-LocalGroupMember -Group "Administrators" -Member "runneradmin"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"
        
    - name: Khởi tạo Tunnel kết nối đường truyền RDP
      run: |
        Start-Process ngrok -ArgumentList "tcp 3389"
        Write-Host "Vui lòng truy cập https://ngrok.com để kiểm tra IP kết nối RDP"
        
    - name: Duy trì kết nối live (Vòng lặp chạy ngầm)
      run: |
        $count = 0
        while ($count -lt 360) {
            Start-Sleep -Seconds 60
            $count++
            Write-Host "Đang giữ phiên RDP hoạt động ổn định... Phút thứ: $count"
        }
