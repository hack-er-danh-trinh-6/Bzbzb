name: Windows-RDP

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: Cài đặt Ngrok bằng Chocolatey
      run: |
        choco install ngrok -y
        
    - name: Xác thực tài khoản Ngrok
      run: |
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        
    - name: Kích hoạt tính năng Remote Desktop trên Windows
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Cập nhật mật khẩu tài khoản Admin hệ thống
      run: |
        $Password = ConvertTo-SecureString "RdpPassword2026!" -AsPlainText -Force
        # Đặt lại mật khẩu cho tài khoản có sẵn và kích hoạt quyền hạn RDP
        Set-LocalUser -Name "runneradmin" -Password $Password
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue
        
    - name: Khởi tạo Tunnel kết nối đường truyền RDP
      run: |
        Start-Process ngrok -ArgumentList "tcp 3389"
        Write-Host "Vui lòng truy cập https://ngrok.com để kiểm tra IP kết nối RDP"
        
    - name: Duy trì kết nối live (Vòng lặp chạy ngầm)
      run: |
        $count = 0
        while ($count -lt 360) {
            Start-Sleep -Seconds 60
            $count++
            Write-Host "Đang giữ phiên RDP hoạt động ổn định... Phút thứ: $count"
        }
