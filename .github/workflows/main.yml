name: Ubuntu-Desktop-RDP

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest # Chuyển sang Ubuntu phiên bản mới nhất
    timeout-minutes: 360 

    steps:
    - name: Cài đặt Ngrok
      run: |
        curl -s https://amazonaws.com | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
        echo "deb https://amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt update && sudo apt install ngrok -y
        
    - name: Xác thực tài khoản Ngrok
      run: |
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        
    - name: Cài đặt Môi trường đồ họa và RDP cho Ubuntu
      run: |
        sudo apt update
        # Cài đặt giao diện XFCE nhẹ và công cụ XRDP
        sudo apt install xfce4 xfce4-goodies xrdp -y
        # Cấu hình XRDP sử dụng giao diện XFCE vừa cài
        echo xfce4-session > ~/.xsession
        sudo systemctl restart xrdp
        
    - name: Thiết lập Mật khẩu cho tài khoản hệ thống
      run: |
        # Đổi mật khẩu của tài khoản 'runner' mặc định thành 'RdpPassword2026!'
        echo "runner:RdpPassword2026!" | sudo chpasswd
        
    - name: Khởi tạo đường truyền RDP qua Ngrok
      run: |
        Write-Host "Đang kích hoạt đường hầm RDP trên Ubuntu..."
        ngrok tcp 3389
