name: Windows-RDP-OBS-Graphics

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: Cài đặt Ngrok và OBS Studio bằng Chocolatey
      run: |
        choco install ngrok obs-studio -y
        
    - name: Xác thực tài khoản Ngrok
      run: |
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        
    - name: Kích hoạt tính năng Remote Desktop trên Windows
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Cấu hình tài khoản đăng nhập hệ thống
      run: |
        net user runneradmin RdpPassword2026! /active:yes
        
    - name: Cài đặt Card đồ họa ảo (Mesa 3D OpenGL) cho OBS
      run: |
        Write-Host "Đang tải Driver đồ họa ảo OpenGL chuẩn..."
        # Tải trực tiếp file driver nhị phân opengl32.dll đã được giải nén sẵn từ bản phân phối tin cậy để tránh lỗi 7zip
        New-Item -ItemType Directory -Force -Path "mesa3d"
        Invoke-WebRequest -Uri "https://github.com" -OutFile "mesa3d\opengl32.dll"
        
        # Tạo thư mục đích của OBS nếu chưa tồn tại và copy driver vào
        $obsBinPath = "C:\Program Files\obs-studio\bin\64bit"
        if (!(Test-Path $obsBinPath)) { New-Item -ItemType Directory -Force -Path $obsBinPath }
        Copy-Item "mesa3d\opengl32.dll" -Destination "$obsBinPath\"
        Write-Host "Cài đặt Driver đồ họa ảo thành công!"

    - name: Khởi tạo Tunnel kết nối đường truyền RDP
      run: |
        Start-Process ngrok -ArgumentList "tcp 3389"
        Write-Host "Vui lòng truy cập https://ngrok.com để kiểm tra IP kết nối RDP"
        
    - name: Duy trì kết nối live (Vòng lặp chạy ngầm)
      run: |
        $count = 0
        while ($count -lt 360) {
            Start-Sleep -Seconds 60
            $count++
            Write-Host "Đang giữ phiên RDP hoạt động ổn định... Phút thứ: $count"
        }
